<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Video Maker</title>
<style>
:root{--bg:#0e0e0f;--card:#19191b;--line:#303034;--tx:#f4f4f5;--mut:#9b9ba3;--y:#f5b800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,sans-serif}
.w{max-width:940px;margin:0 auto;padding:20px}
h1{font-size:24px;margin:0 0 2px;color:var(--y)}p.m{color:var(--mut);margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}
h2{font-size:16px;margin:0 0 6px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;background:#101011;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--y);outline-offset:1px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
button,a.b{display:inline-block;background:var(--y);color:#111;border:0;border-radius:8px;padding:10px 18px;font:700 15px system-ui;cursor:pointer;text-decoration:none;margin-top:12px}
button:disabled{opacity:.5;cursor:wait}
.sc{border-top:1px solid var(--line);padding-top:4px;margin-top:10px}
#log{font-size:13px;color:var(--y);white-space:pre-wrap;min-height:20px}
canvas,video{max-width:100%;max-height:68vh;border-radius:8px;background:#000;display:block;margin:10px 0}
.ck{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);margin-top:10px}.ck input{width:auto}
</style></head><body><div class="w">
<h1>Mini Video Maker</h1>
<p class="m">Chọn chủ đề → AI viết kịch bản → ghép video Pixabay + giọng đọc + phụ đề → tải về.</p>

<div class="card"><h2>Khóa API</h2>
<div class="g">
<div><label>Gemini API key</label><input id="gk" type="password" autocomplete="off"></div>
<div><label>Pixabay API key</label><input id="pk" type="password" autocomplete="off"></div>
<div><label>Model viết kịch bản</label><input id="gm" value="gemini-3.1-flash-lite"></div>
<div><label>Model giọng đọc</label><input id="tm" value="gemini-2.5-flash-preview-tts"></div>
<div><label>Giọng đọc</label><select id="vc"><option>Kore</option><option>Puck</option><option>Charon</option><option>Aoede</option><option>Fenrir</option><option>Leda</option></select></div>
</div>
<label class="ck"><input type="checkbox" id="sv" checked> Nhớ khóa trên trình duyệt này</label></div>

<div class="card"><h2>Nội dung video</h2>
<div class="g">
<div><label>Chủ đề</label><select id="tp"><option value="cam">Camera quan sát</option><option value="sol">Năng lượng mặt trời</option><option value="sh">Smarthome</option><option value="own">Tự nhập</option></select></div>
<div><label>Số cảnh</label><select id="n"><option>4</option><option selected>5</option><option>6</option><option>8</option></select></div>
<div><label>Khung hình</label><select id="ar"><option value="p">Dọc 9:16 (TikTok, Reels, Zalo)</option><option value="l">Ngang 16:9 (YouTube)</option></select></div>
</div>
<label>Ý chính / yêu cầu thêm (không bắt buộc với chủ đề có sẵn)</label>
<textarea id="ex" rows="2" placeholder="Ví dụ: nhấn mạnh tiết kiệm tiền điện cho nhà phố, có pin lưu trữ dùng ban đêm"></textarea>
<label>Dòng cuối video</label><input id="hl" value="Liên hệ tư vấn miễn phí: 0937677889">
<button id="b1">1. Tạo kịch bản</button></div>

<div class="card" id="c2" hidden><h2>Kịch bản (sửa tự do)</h2>
<label>Tiêu đề</label><input id="ti"><div id="sl"></div>
<button id="b2">2. Tạo video</button></div>

<div class="card"><div id="log">Nhập khóa API rồi bấm "Tạo kịch bản".</div>
<canvas id="cv" hidden></canvas>
<div id="out" hidden><video id="rv" controls></video><a class="b" id="dl">Tải video về</a></div></div>
</div>
<script>
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms)),log=t=>$('log').textContent=t;
const K=['gk','pk','gm','tm','vc','hl'];
try{K.forEach(k=>{const v=localStorage.getItem('mv_'+k);if(v)$(k).value=v})}catch(e){}
const save=()=>{if(!$('sv').checked)return;try{K.forEach(k=>localStorage.setItem('mv_'+k,$(k).value))}catch(e){}};
const TOP={cam:'Camera quan sát an ninh cho nhà ở, cửa hàng, xưởng',sol:'Điện năng lượng mặt trời hòa lưới và pin lưu trữ cho gia đình, doanh nghiệp',sh:'Smarthome nhà thông minh: điều khiển đèn, rèm, máy lạnh, khóa cửa bằng điện thoại',own:''};

async function gem(model,body){
 for(let i=0;i<3;i++){
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${$('gk').value.trim()}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status==429||r.status==503){log(`Gemini đang giới hạn tốc độ, chờ ${8*(i+1)}s rồi thử lại...`);await sleep(8000*(i+1));continue}
  const j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);return j;
 }
 throw new Error('Gemini hết quota hoặc quá tải, thử lại sau ít phút');
}
function render(d){
 $('ti').value=d.title;$('sl').innerHTML='';
 d.scenes.forEach((s,i)=>{const e=document.createElement('div');e.className='sc';
  e.innerHTML=`<label>Cảnh ${i+1}: lời đọc</label><textarea rows="2"></textarea><label>Từ khóa tìm video (tiếng Anh)</label><input>`;
  e.children[1].value=s.narration;e.children[3].value=s.keyword;$('sl').appendChild(e)});
 $('c2').hidden=false;
}
$('b1').onclick=async()=>{
 save();const b=$('b1');b.disabled=true;
 try{
  const topic=TOP[$('tp').value],ex=$('ex').value.trim(),n=$('n').value;
  if(!topic&&!ex)throw new Error('Chọn "Tự nhập" thì cần điền ý chính');
  const p=`Viết kịch bản video ngắn bằng tiếng Việt về: ${topic}. ${ex}
Gồm đúng ${n} cảnh. Mỗi cảnh có "narration" (1-2 câu, dưới 28 từ, giọng tư vấn của công ty lắp đặt, dễ hiểu) và "keyword" (1-2 từ khóa TIẾNG ANH ngắn để tìm video stock, ví dụ "security camera", "solar panels roof", "smart home phone"). Cảnh đầu thu hút người xem, cảnh cuối mời liên hệ tư vấn. Không bịa giá tiền hay số liệu cụ thể.
Chỉ trả JSON: {"title":"...","scenes":[{"narration":"...","keyword":"..."}]}`;
  log('Đang viết kịch bản...');
  const j=await gem($('gm').value.trim(),{contents:[{parts:[{text:p}]}],generationConfig:{responseMimeType:'application/json'}});
  render(JSON.parse(j.candidates[0].content.parts[0].text));
  log('Xong kịch bản. Sửa nếu cần rồi bấm "Tạo video".');
 }catch(e){log('Lỗi: '+e.message)}
 b.disabled=false;
};

async function pick(kw){
 const r=await fetch(`https://pixabay.com/api/videos/?key=${$('pk').value.trim()}&q=${encodeURIComponent(kw)}&per_page=10&safesearch=true`);
 if(!r.ok)throw new Error('Pixabay lỗi '+r.status+' (kiểm tra API key)');
 const j=await r.json();if(!j.hits.length)return null;
 const h=j.hits[Math.floor(Math.random()*Math.min(5,j.hits.length))];
 return(h.videos.medium||h.videos.small||h.videos.tiny).url;
}
async function load(url){
 const v=document.createElement('video');v.muted=true;v.loop=true;v.playsInline=true;v.preload='auto';
 try{v.src=URL.createObjectURL(await(await fetch(url)).blob())}catch(e){v.crossOrigin='anonymous';v.src=url}
 await new Promise((ok,no)=>{v.onloadeddata=ok;v.onerror=()=>no(new Error('Không tải được video Pixabay'))});
 return v;
}
async function tts(text,ac){
 const j=await gem($('tm').value.trim(),{contents:[{parts:[{text}]}],generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:$('vc').value}}}}});
 const bin=atob(j.candidates[0].content.parts[0].inlineData.data),n=bin.length>>1,buf=ac.createBuffer(1,n,24000),ch=buf.getChannelData(0);
 for(let i=0;i<n;i++){let v=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8);if(v>32767)v-=65536;ch[i]=v/32768}
 return buf;
}
function wrap(c,t,mw){const L=[];let l='';for(const x of t.split(' ')){const y=l?l+' '+x:x;if(c.measureText(y).width>mw&&l){L.push(l);l=x}else l=y}L.push(l);return L}
function cover(c,v,W,H){const w=v.videoWidth,h=v.videoHeight;if(!w)return;const s=Math.max(W/w,H/h);c.drawImage(v,(W-w*s)/2,(H-h*s)/2,w*s,h*s)}
function text(c,t,W,y,size,color,boxed){
 c.font=`bold ${size}px system-ui,sans-serif`;c.textAlign='center';c.textBaseline='middle';
 const L=wrap(c,t,W*.86),lh=size*1.3,top=y-(L.length*lh)/2;
 if(boxed){c.fillStyle='rgba(0,0,0,.62)';c.fillRect(W*.04,top-size*.4,W*.92,L.length*lh+size*.8)}
 c.fillStyle=color;L.forEach((s,i)=>c.fillText(s,W/2,top+lh*(i+.5)));
}

$('b2').onclick=async()=>{
 save();const b=$('b2');b.disabled=true;$('out').hidden=true;
 let ac,rec;
 try{
  const S=[...$('sl').children].map(e=>({t:e.children[1].value.trim(),k:e.children[3].value.trim()}));
  const port=$('ar').value=='p',W=port?720:1280,H=port?1280:720,title=$('ti').value,end=$('hl').value;
  ac=new(window.AudioContext||window.webkitAudioContext)();
  let voice=true;
  for(let i=0;i<S.length;i++){
   const s=S[i];log(`Cảnh ${i+1}/${S.length}: tìm video "${s.k}"...`);
   const u=await pick(s.k)||await pick(s.k.split(' ')[0])||await pick('technology');
   if(!u)throw new Error('Pixabay không có video cho: '+s.k);
   s.v=await load(u);
   if(voice){log(`Cảnh ${i+1}/${S.length}: tạo giọng đọc...`);
    try{s.a=await tts(s.t,ac)}catch(e){voice=false;log('Giọng đọc lỗi ('+e.message+'). Các cảnh còn lại sẽ không có tiếng.');await sleep(2500)}}
   s.d=s.a?s.a.duration+.5:Math.max(3,s.t.split(' ').length*.4);
  }
  const cv=$('cv');cv.width=W;cv.height=H;cv.hidden=false;const c=cv.getContext('2d');
  const dest=ac.createMediaStreamDestination(),stream=cv.captureStream(30);
  dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  const mt=['video/mp4;codecs=avc1,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  rec=new MediaRecorder(stream,{mimeType:mt,videoBitsPerSecond:4e6});
  const chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  const st=[];let acc=0;S.forEach(s=>{st.push(acc);acc+=s.d});const T=acc+2.5;
  await ac.resume();rec.start(1000);
  const t0=ac.currentTime+.3;
  S.forEach((s,i)=>{if(s.a){const n=ac.createBufferSource();n.buffer=s.a;n.connect(dest);n.start(t0+st[i]+.15)}});
  let cur=-1,chk=false,bad=false;
  await new Promise(done=>{(function f(){
   const t=ac.currentTime-t0;
   if(t>=T){done();return}
   c.fillStyle='#0e0e0f';c.fillRect(0,0,W,H);
   if(t<0){requestAnimationFrame(f);return}
   const i=S.findIndex((s,k)=>t<st[k]+s.d);
   if(i<0){
    if(cur>=0){S[cur].v.pause();cur=-1}
    text(c,end,W,H/2,W*.065,'#f5b800',false);
   }else{
    if(i!=cur){if(cur>=0)S[cur].v.pause();S[i].v.currentTime=0;S[i].v.play();cur=i}
    cover(c,S[i].v,W,H);
    if(!chk){chk=true;try{c.getImageData(0,0,1,1)}catch(e){bad=true;done();return}}
    c.fillStyle='rgba(0,0,0,.35)';c.fillRect(0,0,W,H*.14);
    text(c,title,W,H*.07,W*.042,'#f5b800',false);
    text(c,S[i].t,W,H*.78,W*.048,'#fff',true);
   }
   log(`Đang ghi video... ${Math.min(100,Math.round(t/T*100))}% (giữ tab này mở)`);
   requestAnimationFrame(f);
  })()});
  rec.stop();await new Promise(r=>rec.onstop=r);
  S.forEach(s=>s.v.pause());
  if(bad)throw new Error('Trình duyệt chặn video từ Pixabay (CORS). Thử lại hoặc đổi từ khóa.');
  const type=mt.split(';')[0],url=URL.createObjectURL(new Blob(chunks,{type}));
  $('rv').src=url;$('dl').href=url;$('dl').download='video-'+Date.now()+(type=='video/mp4'?'.mp4':'.webm');
  cv.hidden=true;$('out').hidden=false;log('Xong! Xem thử và tải về bên dưới.');
 }catch(e){log('Lỗi: '+e.message);try{rec&&rec.state!='inactive'&&rec.stop()}catch(x){}}
 try{ac&&ac.close()}catch(e){}
 b.disabled=false;
};
</script></body></html>
